<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globo Astratto Rotante</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030712;
      --core: #1d4ed8;
      --core-glow: #38bdf8;
      --grid: rgba(125, 211, 252, 0.45);
      --ring: rgba(56, 189, 248, 0.28);
      --text: #dbeafe;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.2), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(14, 165, 233, 0.18), transparent 30%),
        var(--bg);
      overflow: hidden;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
    }

    .scene {
      position: relative;
      width: min(85vmin, 720px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 42px rgba(14, 165, 233, 0.2));
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .label {
      position: absolute;
      bottom: -2.5rem;
      letter-spacing: 0.25em;
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Globo terrestre astratto rotante">
    <canvas id="globe" width="900" height="900"></canvas>
    <p class="label">Earth · Abstract</p>
  </main>

  <script>
    const canvas = document.getElementById('globe');
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const radius = Math.min(w, h) * 0.34;

    const stripes = Array.from({ length: 24 }, (_, i) => {
      const t = (i / 23) * 2 - 1;
      return {
        y: t,
        thickness: 1.2 + Math.random() * 1.8,
        phase: Math.random() * Math.PI * 2
      };
    });

    const points = Array.from({ length: 180 }, () => {
      const u = Math.random() * Math.PI * 2;
      const v = Math.acos(2 * Math.random() - 1);
      return { theta: u, phi: v, size: 1 + Math.random() * 2.5 };
    });

    const stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8,
      twinkle: Math.random() * Math.PI * 2
    }));

    function drawBackground(time) {
      ctx.clearRect(0, 0, w, h);

      stars.forEach((s) => {
        const alpha = 0.2 + Math.abs(Math.sin(time * 0.001 + s.twinkle)) * 0.8;
        ctx.fillStyle = `rgba(186, 230, 253, ${alpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawGlobe(time) {
      const spin = time * 0.00028;

      ctx.save();
      ctx.translate(cx, cy);

      const fill = ctx.createRadialGradient(-radius * 0.2, -radius * 0.25, radius * 0.1, 0, 0, radius);
      fill.addColorStop(0, '#0f172a');
      fill.addColorStop(0.55, '#0b2a5f');
      fill.addColorStop(1, '#020617');

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.clip();

      stripes.forEach((s) => {
        const y = s.y * radius;
        const bandR = Math.sqrt(Math.max(radius * radius - y * y, 0));
        const shift = Math.sin(spin + s.phase) * bandR * 0.25;

        ctx.beginPath();
        ctx.ellipse(shift, y, bandR, bandR * 0.18, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.22)';
        ctx.lineWidth = s.thickness;
        ctx.stroke();
      });

      points.forEach((p) => {
        const theta = p.theta + spin;
        const x = radius * Math.sin(p.phi) * Math.cos(theta);
        const y = radius * Math.cos(p.phi);
        const z = radius * Math.sin(p.phi) * Math.sin(theta);

        if (z > -radius * 0.2) {
          const alpha = 0.25 + ((z + radius) / (radius * 2)) * 0.75;
          ctx.fillStyle = `rgba(56, 189, 248, ${alpha})`;
          ctx.beginPath();
          ctx.arc(x, y, p.size * (0.5 + alpha * 0.5), 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.restore();

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 1.25, radius * 0.4, Math.PI / 7, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, 0, radius * 1.1, radius * 0.3, -Math.PI / 8, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    function animate(time) {
      drawBackground(time);
      drawGlobe(time);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
